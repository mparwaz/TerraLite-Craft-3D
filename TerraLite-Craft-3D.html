<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Voxel Engine (Dynamic Chunks)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #87CEEB; /* Sky blue fallback */
            user-select: none;
        }

        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }

        /* Top Info */
        #info {
            padding: 10px;
            color: white;
            text-shadow: 1px 1px 0 #000;
            font-size: 14px;
        }

        /* Block Selector */
        #toolbar {
            display: flex;
            justify-content: center;
            padding-bottom: 20px;
            gap: 10px;
        }
        .slot {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 0, 0, 0.3);
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 10px;
            line-height: 1;
            transition: transform 0.1s, border-color 0.1s;
            pointer-events: auto; /* Re-enable clicks on the toolbar */
        }
        .slot.active {
            border-color: white;
            transform: scale(1.1);
            background: rgba(0, 0, 0, 0.7);
        }

        /* Instructions Overlay */
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99;
            color: white;
            pointer-events: auto; /* Capture clicks */
            cursor: pointer;
        }
        #instructions {
            text-align: center;
            font-size: 24px;
            line-height: 1.5;
        }
        .key {
            display: inline-block;
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #555;
            font-size: 0.8em;
            margin: 0 2px;
        }
    </style>
    <!-- Import Three.js as an ES module -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- UI Overlay -->
    <div id="ui-container">
        <div id="info">
            <b>Minimal Voxel Engine (Dynamic Chunks)</b><br>
            WASD to Move | Shift to Sprint | Space to Jump | L-Click: Destroy | R-Click: Place
        </div>
        <div id="crosshair"></div>
        <div id="toolbar">
            <div class="slot active" id="slot-1" data-type="grass">1<br>Grass</div>
            <div class="slot" id="slot-2" data-type="stone">2<br>Stone</div>
            <div class="slot" id="slot-3" data-type="dirt">3<br>Dirt</div>
            <div class="slot" id="slot-4" data-type="wood">4<br>Wood</div>
            <div class="slot" id="slot-5" data-type="leaves">5<br>Leaves</div>
        </div>
    </div>

    <div id="blocker">
        <div id="instructions">
            <p style="font-size:36px">CLICK TO PLAY</p>
            <p>
                Move: <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span><br>
                Sprint: <span class="key">SHIFT</span><br>
                Jump: <span class="key">SPACE</span><br>
                Look: Mouse<br>
                Build/Break: Mouse Buttons
            </p>
        </div>
    </div>

   <script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

    // --- CHUNK & WORLD CONFIGURATION ---
    const CHUNK_SIZE = 16; // 16x16 blocks per chunk
    const VIEW_DISTANCE = 3;
    const BLOCK_SIZE = 1;

    // --- GENERAL CONFIGURATION ---
    const PLAYER_HEIGHT = 1.6;
    const PLAYER_SPEED = 30.0;
    const SPRINT_SPEED = 20.0;
    const JUMP_FORCE = 10.0;
    const GRAVITY = 30.0;
    
    const TREE_DENSITY = 0.08; 
    const MIN_TREE_SPACING = 7; 
    
    const Y_OFFSET = 5; // Global vertical offset

    // --- STATE ---
    let camera, scene, renderer, controls;
    let raycaster;
    let moveForward = false;
    let moveBackward = false;
    let moveLeft = false;
    let moveRight = false;
    let canJump = false;
    let isSprinting = false; 
    let currentChunkKey = null;

    let prevTime = performance.now();
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();

    // Voxel Data
    const objects = []; // For raycasting
    const voxelMap = new Map(); // Global block lookup for collision/removal
    const chunkGroups = new Map(); // Stores THREE.Group for each chunk 

    // Texture and Block Definitions
    let TEXTURES = {};
    let blockTypes = [];
    let SHARED_MATERIALS = {}; // IMPORTANT: Holds all unique materials for reuse
    let currentBlockType; 

    // Shared Geometry
    // We only ever need ONE geometry instance because all meshes are cubes of the same size.
    const boxGeometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
    // Mark as shared so we don't dispose it when a block is removed
    boxGeometry.userData.isShared = true; 

    // --- TEXTURE GENERATION (omitted for brevity) ---
    function generateTextures() {
        // ... (original texture generation code is fine)
        const size = 16;
        const textures = {};
        const createTexture = (drawFunction) => {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            drawFunction(ctx, size);
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.NearestFilter;
            texture.magFilter = THREE.NearestFilter;
            return texture;
        };

        const baseColor = (color) => (ctx) => { ctx.fillStyle = color; ctx.fillRect(0, 0, size, size); };
        textures.grass_top = createTexture(baseColor('#5C9E47'));
        textures.dirt = createTexture(baseColor('#8B5A2B'));
        textures.stone = createTexture(baseColor('#787878'));
        textures.wood = createTexture(baseColor('#A0522D'));
        textures.leaves = createTexture(baseColor('#4D8B3C'));
        textures.grass_side = createTexture((ctx, s) => {
            ctx.fillStyle = '#5C9E47'; ctx.fillRect(0, 0, s, s * 0.75); 
            ctx.fillStyle = '#8B5A2B'; ctx.fillRect(0, s * 0.75, s, s * 0.25);
        });
        return textures;
    }

    // --- BLOCK TYPE DEFINITIONS (Materials) ---
    function setupBlockTypes(textures) {
        // --- OPTIMIZATION 1: Centralize and Share Materials ---
        const createMaterial = (texture, isTransparent = false) => new THREE.MeshLambertMaterial({ 
            map: texture, 
            transparent: isTransparent,
            opacity: isTransparent ? 0.8 : 1.0, 
            side: isTransparent ? THREE.DoubleSide : THREE.FrontSide
        });
        
        // Create all unique material instances once
        SHARED_MATERIALS = {
            grass_side: createMaterial(textures.grass_side),
            grass_top: createMaterial(textures.grass_top),
            dirt: createMaterial(textures.dirt),
            stone: createMaterial(textures.stone),
            wood: createMaterial(textures.wood),
            leaves: createMaterial(textures.leaves, true),
        };
        
        // Define blocks using references to the shared materials
        blockTypes = [
            { name: 'grass', materials: [
                SHARED_MATERIALS.grass_side, SHARED_MATERIALS.grass_side, 
                SHARED_MATERIALS.grass_top, SHARED_MATERIALS.dirt, 
                SHARED_MATERIALS.grass_side, SHARED_MATERIALS.grass_side 
            ]},
            { name: 'stone', materials: Array(6).fill(SHARED_MATERIALS.stone) },
            { name: 'dirt', materials: Array(6).fill(SHARED_MATERIALS.dirt) },
            { name: 'wood', materials: Array(6).fill(SHARED_MATERIALS.wood) },
            { name: 'leaves', materials: Array(6).fill(SHARED_MATERIALS.leaves) },
        ];
        
        currentBlockType = blockTypes[0];
    }


    // --- INITIALIZATION (omitted for brevity) ---
    init();
    animate();

    function init() {
        TEXTURES = generateTextures();
        setupBlockTypes(TEXTURES);

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 10, 60);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 5 + Y_OFFSET; 
        camera.position.x = 0;
        camera.position.z = 0;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true; 
        scene.add(dirLight);

        controls = new PointerLockControls(camera, document.body);
        
        const blocker = document.getElementById('blocker');
        const instructions = document.getElementById('instructions');

        blocker.addEventListener('click', function () { controls.lock(); });
        controls.addEventListener('lock', function () {
            instructions.style.display = 'none';
            blocker.style.display = 'none';
        });
        controls.addEventListener('unlock', function () {
            blocker.style.display = 'flex';
            instructions.style.display = '';
        });
        scene.add(controls.getObject());

        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('mousedown', onMouseClick);
        
        document.querySelectorAll('.slot').forEach((el, index) => {
            el.addEventListener('click', (event) => {
                if (controls.isLocked) {
                    selectBlock(index);
                }
            });
        });

        updateChunks();

        raycaster = new THREE.Raycaster();
        raycaster.near = 0.1;
        raycaster.far = 8; 

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        window.addEventListener('resize', onWindowResize);
    }
    
    // --- VOXEL UTILITIES ---

    function getMapKey(x, y, z) {
        return `${Math.round(x)},${Math.round(y)},${Math.round(z)}`;
    }

    function getChunkCoordinates(x, z) {
        const cx = Math.floor(x / CHUNK_SIZE);
        const cz = Math.floor(z / CHUNK_SIZE);
        return { cx, cz };
    }

    function getChunkKey(x, z) {
        const { cx, cz } = getChunkCoordinates(x, z);
        return `${cx},${cz}`;
    }
    
    function checkCollision(x, y, z) {
        return voxelMap.has(getMapKey(x, y, z));
    }

    function removeVoxel(x, y, z) {
        const key = getMapKey(x, y, z);
        const voxel = voxelMap.get(key);
        
        if (voxel) {
            // 1. Remove from scene/group
            if (voxel.parent) voxel.parent.remove(voxel); 
            
            // 2. Remove from objects array (for raycasting) - IMPORTANT: using a slow array operation
            const index = objects.indexOf(voxel);
            if (index > -1) {
                objects.splice(index, 1);
            }
            
            // 3. Remove from global map
            voxelMap.delete(key);
            
            // 4. Dispose of resources - IMPORTANT: Only dispose if not shared
            if (voxel.geometry.userData.isShared !== true) {
                voxel.geometry.dispose(); 
            }
            // Materials are shared and SHOULD NOT be disposed here.
        }
    }

    function createVoxel(x, y, z, type) {
        const key = getMapKey(x, y, z);
        
        if (voxelMap.has(key)) {
            removeVoxel(x, y, z); 
        }
        
        // --- OPTIMIZATION 2: Use Shared Geometry and Materials ---
        const geometry = boxGeometry; // Use the shared geometry

        const voxel = new THREE.Mesh(geometry, type.materials);
        
        voxel.position.set(
            Math.round(x),
            Math.round(y),
            Math.round(z)
        );

        voxel.castShadow = true;
        voxel.receiveShadow = true;
        
        // Add to Chunk Group
        const chunkKey = getChunkKey(x, z);
        let chunkGroup = chunkGroups.get(chunkKey);

        if (!chunkGroup) {
             // Create group if placing a block in an ungenerated chunk
             chunkGroup = new THREE.Group();
             chunkGroup.name = `Chunk_${chunkKey}`; // Add name for debug
             chunkGroup.userData.voxelKeys = new Set(); // Create the index
             scene.add(chunkGroup);
             chunkGroups.set(chunkKey, chunkGroup);
        }

        chunkGroup.add(voxel);
        
        objects.push(voxel);
        voxelMap.set(key, voxel);
        
        // --- OPTIMIZATION 3: Index the Voxel Key to the Chunk Group ---
        // This is CRITICAL for fast chunk removal (removeChunk)
        chunkGroup.userData.voxelKeys.add(key);
    }

    function placeVoxelIfEmpty(x, y, z, type) {
        if (!voxelMap.has(getMapKey(x, y, z))) {
            createVoxel(x, y, z, type);
        }
    }


    // --- WORLD GENERATION FUNCTIONS ---

    function placeTree(x, z, h) {
        // ... (Original placeTree logic is fine)
        const woodType = blockTypes[3]; 
        const leavesType = blockTypes[4]; 

        const trunkStartY = h + 1; 

        if (checkCollision(x, trunkStartY, z)) return;
        if (!checkCollision(x, h, z)) return; 
        
        const trunkHeight = Math.floor(Math.random() * 2) + 4; 
        for (let y = trunkStartY; y < h + trunkHeight; y++) {
            createVoxel(x, y, z, woodType);
        }

        const canopyTopY = h + trunkHeight;

        for (let dy = -1; dy <= 1; dy++) { 
            for (let dx = -1; dx <= 1; dx++) {
                for (let dz = -1; dz <= 1; dz++) {
                    
                    if (dy === 1 && (Math.abs(dx) === 1 && Math.abs(dz) === 1)) continue; 
                    if (dy === -1 && (Math.abs(dx) === 1 && Math.abs(dz) === 1)) continue; 
                    if (dx === 0 && dz === 0 && dy < 0) continue; 
                    
                    const lx = x + dx;
                    const ly = canopyTopY + dy;
                    const lz = z + dz;
                    
                    placeVoxelIfEmpty(lx, ly, lz, leavesType);
                }
            }
        }
    }

    function generateChunk(cx, cz) {
        const startX = cx * CHUNK_SIZE;
        const startZ = cz * CHUNK_SIZE;
        
        const chunkKey = `${cx},${cz}`;
        const chunkGroup = new THREE.Group();
        chunkGroup.name = `Chunk_${chunkKey}`;
        // Create the set for fast indexing immediately upon creation
        chunkGroup.userData.voxelKeys = new Set(); 
        scene.add(chunkGroup);
        chunkGroups.set(chunkKey, chunkGroup);
        
        // Bedrock plane (optimization: give it a fixed key so we don't try to add it to voxelMap)
        const bedrockGeo = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE);
        bedrockGeo.rotateX(-Math.PI / 2);
        // Optimization: Create this material once and share it
        if (!SHARED_MATERIALS.bedrockMat) {
            SHARED_MATERIALS.bedrockMat = new THREE.MeshBasicMaterial({ color: 0x222222, side: THREE.DoubleSide });
        }
        const bedrock = new THREE.Mesh(bedrockGeo, SHARED_MATERIALS.bedrockMat);
        bedrock.position.set(startX + CHUNK_SIZE / 2 - 0.5, -1.5, startZ + CHUNK_SIZE / 2 - 0.5);
        bedrock.name = 'bedrock_plane'; 
        chunkGroup.add(bedrock);


        for (let x = startX; x < startX + CHUNK_SIZE; x+=BLOCK_SIZE) {
            for (let z = startZ; z < startZ + CHUNK_SIZE; z+=BLOCK_SIZE) {
                
                const hillHeight = Math.floor(
                    Math.sin(x * 0.1) * 2 + 
                    Math.cos(z * 0.1) * 2
                ) + Y_OFFSET;

                const depth = 3;
                for (let i = 0; i < depth; i++) {
                    const y = hillHeight - i;
                    
                    if (i === 0) {
                        createVoxel(x, y, z, blockTypes[0]); // Grass
                    } else if (i === 1) {
                        createVoxel(x, y, z, blockTypes[2]); // Dirt
                    } else {
                        createVoxel(x, y, z, blockTypes[1]); // Stone
                    }
                }

                const worldX = Math.round(x);
                const worldZ = Math.round(z);

                if (worldX % MIN_TREE_SPACING === 0 && worldZ % MIN_TREE_SPACING === 0) {
                    if (Math.random() < TREE_DENSITY) { 
                        placeTree(x, z, hillHeight); 
                    }
                }
            }
        }
        console.log(`Generated chunk: ${chunkKey}`);
    }
    
    // Function to remove a chunk and clean up all associated resources
    function removeChunk(chunkKey) {
        const group = chunkGroups.get(chunkKey);
        if (group) {
            console.log(`Unloading chunk: ${chunkKey}`);
            
            // --- CRITICAL OPTIMIZATION: Use the pre-indexed Set for fast cleanup ---
            if (group.userData.voxelKeys) {
                // Iterating over a Set is extremely fast. We use the keys to find the voxel 
                // in the global voxelMap and then call removeVoxel for cleanup.
                group.userData.voxelKeys.forEach(key => {
                    const [x, y, z] = key.split(',').map(Number);
                    // removeVoxel handles: 1) removing mesh from group/scene, 2) objects array, 3) voxelMap, 4) resource disposal.
                    removeVoxel(x, y, z); 
                });
                // Clear the index once done. The set is part of userData, so it goes when group is removed.
            }
            // The bedrock plane cleanup is now separated from the voxel cleanup
            const bedrock = group.getObjectByName('bedrock_plane');
            if (bedrock) {
                bedrock.geometry.dispose();
                // Material is SHARED_MATERIALS.bedrockMat and should NOT be disposed.
                group.remove(bedrock);
            }
            
            // Remove the now-empty group from the scene and map
            scene.remove(group);
            chunkGroups.delete(chunkKey);
        }
    }


    function updateChunks() {
        // ... (Original updateChunks logic is fine)
        const playerPos = controls.getObject().position;
        const { cx, cz } = getChunkCoordinates(playerPos.x, playerPos.z);
        
        const newChunkKey = `${cx},${cz}`;
        if (newChunkKey === currentChunkKey) {
            return;
        }
        currentChunkKey = newChunkKey;

        const halfView = Math.floor(VIEW_DISTANCE / 2);
        const keysToKeep = new Set();
        
        for (let i = -halfView; i <= halfView; i++) {
            for (let j = -halfView; j <= halfView; j++) {
                const targetCx = cx + i;
                const targetCz = cz + j;
                const targetKey = `${targetCx},${targetCz}`;
                keysToKeep.add(targetKey);

                if (!chunkGroups.has(targetKey)) {
                    generateChunk(targetCx, targetCz);
                }
            }
        }
        
        const keysToRemove = [];
        chunkGroups.forEach((group, key) => {
            if (!keysToKeep.has(key)) {
                keysToRemove.push(key);
            }
        });

        keysToRemove.forEach(key => {
            removeChunk(key);
        });
    }

    // --- INTERACTION / PHYSICS / ANIMATE LOOP (Omitted - same as previous version) ---
    function onMouseClick(event) {
        if (!controls.isLocked) return;
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const intersects = raycaster.intersectObjects(objects, false);

        if (intersects.length > 0) {
            const intersect = intersects[0];
            if (event.button === 0) {
                const p = intersect.object.position;
                removeVoxel(p.x, p.y, p.z);
            }
            if (event.button === 2) {
                const p = intersect.object.position.clone();
                // IMPORTANT: Ensure the face normal is properly handled for new block placement
                const n = intersect.face ? intersect.face.normal.clone() : new THREE.Vector3(0, 1, 0); 
                n.normalize(); // Ensure the normal is clean
                const target = p.add(n);
                
                const gx = Math.round(target.x);
                const gy = Math.round(target.y);
                const gz = Math.round(target.z);

                const playerObj = controls.getObject();
                const playerPos = playerObj.position;
                const dx = Math.abs(playerPos.x - gx);
                const dz = Math.abs(playerPos.z - gz);
                const feetY = playerPos.y - PLAYER_HEIGHT;
                const headY = playerPos.y;
                
                // Block placement collision check
                if (dx < 0.8 && dz < 0.8 && (gy + 0.5 > feetY && gy - 0.5 < headY)) {
                    return;
                }
                createVoxel(gx, gy, gz, currentBlockType);
            }
        }
    }

    function onKeyDown(event) {
        switch (event.code) {
            case 'ArrowUp': case 'KeyW': moveForward = true; break;
            case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
            case 'ArrowDown': case 'KeyS': moveBackward = true; break;
            case 'ArrowRight': case 'KeyD': moveRight = true; break;
            case 'Space': 
                if (canJump === true) velocity.y += JUMP_FORCE;
                canJump = false;
                break;
            case 'ShiftLeft': case 'ShiftRight':
                isSprinting = true;
                break;
            case 'Digit1': selectBlock(0); break;
            case 'Digit2': selectBlock(1); break;
            case 'Digit3': selectBlock(2); break;
            case 'Digit4': selectBlock(3); break;
            case 'Digit5': selectBlock(4); break; 
        }
    }

    function onKeyUp(event) {
        switch (event.code) {
            case 'ArrowUp': case 'KeyW': moveForward = false; break;
            case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
            case 'ArrowDown': case 'KeyS': moveBackward = false; break;
            case 'ArrowRight': case 'KeyD': moveRight = false; break;
            case 'ShiftLeft': case 'ShiftRight':
                isSprinting = false;
                break;
        }
    }

    function selectBlock(index) {
        if(index < blockTypes.length) {
            currentBlockType = blockTypes[index];
            document.querySelectorAll('.slot').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
        }
    }


    function animate() {
        requestAnimationFrame(animate);

        const time = performance.now();
        const delta = (time - prevTime) / 1000;
      
       const playerObj = controls.getObject() || camera;
        let currentFPS = 0;

        
        if (controls.isLocked === true) {
           
            
            updateChunks();

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= GRAVITY * delta;

            const camDir = new THREE.Vector3();
            camera.getWorldDirection(camDir);
            camDir.y = 0; 
            camDir.normalize();

            const camRight = new THREE.Vector3();
            camRight.crossVectors(camDir, new THREE.Vector3(0, 1, 0));
            camRight.normalize();

            const inputForward = Number(moveForward) - Number(moveBackward);
            const inputRight = Number(moveRight) - Number(moveLeft);

            if (inputForward !== 0 || inputRight !== 0) {
                const moveVec = new THREE.Vector3();
                moveVec.addScaledVector(camDir, inputForward);
                moveVec.addScaledVector(camRight, inputRight);
                moveVec.normalize(); 
                
                const currentSpeed = isSprinting ? SPRINT_SPEED : PLAYER_SPEED;

                velocity.x += moveVec.x * currentSpeed * delta;
                velocity.z += moveVec.z * currentSpeed * delta;
            }

            const playerObj = controls.getObject();
            const originalPos = playerObj.position.clone();
            
            const currentFeetY = playerObj.position.y - PLAYER_HEIGHT;
            const floorYLevel = Math.round(currentFeetY - 0.5); 

            const checkBody = (px, py, pz) => {
                const ix = Math.round(px);
                const iz = Math.round(pz);
                const y1 = floorYLevel + 1;
                const y2 = floorYLevel + 2; 
                return checkCollision(ix, y1, iz) || checkCollision(ix, y2, iz);
            };

            playerObj.position.x += velocity.x * delta;
            if (checkBody(playerObj.position.x, playerObj.position.y, playerObj.position.z)) {
                playerObj.position.x = originalPos.x;
                velocity.x = 0;
            }

            playerObj.position.z += velocity.z * delta;
            if (checkBody(playerObj.position.x, playerObj.position.y, playerObj.position.z)) {
                playerObj.position.z = originalPos.z;
                velocity.z = 0;
            }

            playerObj.position.y += velocity.y * delta;
            
            const feetY = playerObj.position.y - PLAYER_HEIGHT;
            const blockBelowY = Math.round(feetY - 0.5);
            
            if (checkCollision(Math.round(playerObj.position.x), blockBelowY, Math.round(playerObj.position.z))) {
                if (velocity.y < 0) {
                    velocity.y = 0;
                    canJump = true;
                    playerObj.position.y = blockBelowY + 0.5 + PLAYER_HEIGHT;
                }
            } else {
                canJump = false;
            }

            if (playerObj.position.y < -10) {
                velocity.y = 0;
                playerObj.position.y = 10 + Y_OFFSET;
                playerObj.position.x = 0;
                playerObj.position.z = 0;
            }
        }

        prevTime = time;

  document.getElementById('info').innerHTML = `
            <b>Minimal Voxel Engine (Dynamic Chunks)</b><br>
            FPS: ${Math.round(1 / delta)} | 
            Pos: ${playerObj.position.x.toFixed(1)}, ${playerObj.position.y.toFixed(1)}, ${playerObj.position.z.toFixed(1)} | 
            Blocks: ${objects.length}
        `;

        
        renderer.render(scene, camera);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
</script></body>
</html>
